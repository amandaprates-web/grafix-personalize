services:
  mongo:
    image: mongo:7
    container_name: grafix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - grafix-net

  servico-auth:
    build: ./servico-auth
    container_name: grafix-auth
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/grafix-auth
      - JWT_SECRET=${JWT_SECRET:-segredo-super-secreto-troque-isso}
    depends_on:
      - mongo
    networks:
      - grafix-net

  servico-clientes:
    build: ./servico-clientes
    container_name: grafix-clientes
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/grafix-clientes
      - JWT_SECRET=${JWT_SECRET:-segredo-super-secreto-troque-isso}
    depends_on:
      - mongo
    networks:
      - grafix-net

  servico-produtos:
    build: ./servico-produtos
    container_name: grafix-produtos
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongo:27017/grafix-produtos
      - JWT_SECRET=${JWT_SECRET:-segredo-super-secreto-troque-isso}
    depends_on:
      - mongo
    networks:
      - grafix-net

  servico-pedidos:
    build: ./servico-pedidos
    container_name: grafix-pedidos
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo:27017/grafix-pedidos
      - JWT_SECRET=${JWT_SECRET:-segredo-super-secreto-troque-isso}
    depends_on:
      - mongo
    networks:
      - grafix-net

  clientes-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: clientes-mcp
    restart: always
    volumes:
      - ./mcp:/mcp
    command: python3 /mcp/clientes/ferramentas.py
    env_file:
      - ./mcp/.env
    ports:
      - "8001:8000"
    networks:
      - grafix-net

  produtos-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: produtos-mcp
    restart: always
    volumes:
      - ./mcp:/mcp
    command: python3 /mcp/produtos/ferramentas.py
    env_file:
      - ./mcp/.env
    ports:
      - "8002:8000"
    networks:
      - grafix-net

  pedidos-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: pedidos-mcp
    restart: always
    volumes:
      - ./mcp:/mcp
    command: python3 /mcp/pedidos/ferramentas.py
    env_file:
      - ./mcp/.env
    ports:
      - "8003:8000"
    networks:
      - grafix-net

networks:
  grafix-net:
    external: true
  
volumes:
  mongo-data: